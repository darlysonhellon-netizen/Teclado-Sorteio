name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: |
          rm -rf project
          mkdir project
          unzip -o Teclado-Sorteio-Source.zip -d project
          gradle -p project --no-daemon assembleDebug
          cp project/app/build/outputs/apk/debug/app-debug.apk Teclado-Sorteio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teclado-Sorteio-APK
          path: Teclado-Sorteio.apk
          retention-days: 30
