nome: Gerar APK Teclado Sorteio

sobre:
  despacho de fluxo de trabalho:
  empurrar:
    ramos: [ "principal" ]
    caminhos:
      - ".github/workflows/build-apk.yml"

permissões:
  Conteúdo: escrever

empregos:
  construir:
    runs-on: ubuntu-latest
    ambiente:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    passos:
      - nome: Preparar Java
        utiliza: actions/setup-java@v4
        com:
          Distribuição: temurin
          versão java: "17"

      - nome: Preparar Android SDK 35
        ambiente:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        executar: |
          sim | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - nome: Preparar Gradle
        usa: gradle/actions/setup-gradle@v4
        com:
          versão-gradle: "8.7"

      - nome: Criar projeto Android
        executar: |
          mkdir -p app/src/main/java/com/tecladosorteio/app
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          gerenciamentoDePlugins {
              repositórios {
                  Google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          gerenciamentoDeResoluçãoDeDependências {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositórios {
                  Google()
                  mavenCentral()
              }
          }
          rootProject.name = "TecladoSorteio"
          incluir(":app")
          Fim do jogo

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' versão '8.5.2' aplicar falso
          }
          Fim do jogo

          gato > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          Fim do jogo

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tecladosorteio.app'
              compileSdk 35

              Configuração padrão {
                  applicationId "com.tecladosorteio.app"
                  minSdk 26
                  targetSdk 35
                  código da versão 1
                  nome da versão "1.0"
              }

              buildTypes {
                  liberar {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          Fim do jogo

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <aplicativo>
                  android:allowBackup="true"
                  android:label="Teclado Sorteio"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <atividade
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </atividade>

                  <serviço
                      android:name=".GiveawayKeyboardService"
                      android:exported="true"
                      android:label="Teclado Sorteio"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-dados
                          android:name="android.view.im"
                          android:resource="@xml/input_method" />
                  </serviço>
              </aplicação>
          </manifesto>
          Fim do jogo

          cat > app/src/main/res/xml/input_method.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.tecladosorteio.app.MainActivity"
              android:supportsSwitchingToNextInputMethod="true" />
          Fim do jogo

          cat > app/src/main/java/com/tecladosorteio/app/MainActivity.java <<'EOF'
          pacote com.tecladosorteio.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.ViewGroup;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          importar java.util.LinkedHashSet;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {
              private static final int PICK_FILES = 41;
              Caixa de texto editável privada;
              Estatísticas privadas do TextView;

              @Substituir
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout raiz = novo LinearLayout(this);
                  raiz.setOrientation(LinearLayout.VERTICAL);
                  raiz.setPadding(dp(16), dp(18), dp(16), dp(32));
                  scroll.addView(root);

                  TextView title = text("Teclado Sorteio", 27, true);
                  raiz.adicionarVisualização(título);
                  raiz.adicionarVisualização(texto(
                          "Cole seus @ ou importe arquivos JSON/TXT exportados do Instagram. " +
                          "Depois use o teclado especial dentro da própria postagem.",
                          15, falso));

                  listBox = new EditText(this);
                  listBox.setHint("@pessoa1\n@pessoa2\n@pessoa3");
                  listBox.setMinLines(10);
                  listBox.setTextColor(Color.BLACK);
                  listBox.setText(joinQueue(UserStore.queue(this)));
                  root.addView(listBox, full());

                  Botão importButton = button("Importar JSON/TXT do Instagram");
                  importButton.setOnClickListener(v -> chooseFiles());
                  raiz.adicionarVisualização(botãodeimportação);

                  Button saveButton = button("Salvar e embaralhar lista");
                  saveButton.setOnClickListener(v -> saveList(true));
                  raiz.adicionarVisualização(botãoSalvar);

                  estatísticas = texto("", 14, verdadeiro);
                  raiz.adicionarVisualização(estatísticas);

                  Habilitar botão = button("Ativar Teclado Sorteio");
                  enable.setOnClickListener(v ->
                          iniciarAtividade(novo Intent(Configurações.ACTION_INPUT_METHOD_SETTINGS)));
                  raiz.adicionarVisualização(habilitar);

                  Botão escolher = button("Selecionar Teclado Sorteio");
                  escolha.setOnClickListener(v -> {
                      Gerenciador de Métodos de Entrada imm =
                              (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                      imm.showInputMethodPicker();
                  });
                  raiz.adicionarVisualização(escolha);

                  Botão reset = button("Zerar progresso");
                  reset.setOnClickListener(v -> {
                      UserStore.setIndex(this, 0);
                      atualizar();
                      Toast.makeText(this, "Progresso zerado.", Toast.LENGTH_SHORT).show();
                  });
                  raiz.adicionarVisualização(redefinir);

                  raiz.adicionarVisualização(texto(
                          "\nUso: abra a postagem no Instagram, toque em comentar, escolha o " +
                          "Teclado Sorteio e toque em INSERIR @... Depois toque em Enviar no " +
                          "Instagram. O próximo nome já ficou preparado.\n\n" +
                          "Privacidade: este app não possui permissão de Internet.",
                          14, falso));

                  setContentView(scroll);
                  atualizar();
              }

              privado void escolherArquivos() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.adicionarCategoria(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  i.putExtra(Intent.EXTRA_MIME_TYPES,
                          novo String[]{"application/json", "text/plain", "text/json"});
                  iniciarAtividadeParaResultado(i, SELECIONAR_ARQUIVOS);
              }

              @Substituir
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  se (requestCode != PICK_FILES || resultCode != RESULT_OK || data == null) retornar;

                  LinkedHashSet<String> usuários = parseUsers(listBox.getText().toString());

                  tentar {
                      ClipData clip = data.getClipData();
                      se (clip != null) {
                          para (int i = 0; i < clip.getItemCount(); i++) {
                              Uri uri = clip.getItemAt(i).getUri();
                              usuários.adicionarTodos(analisarUsuários(lerUri(uri)));
                          }
                      } else if (data.getData() != null) {
                          usuários.adicionarTodos(parseUsers(readUri(dados.getData())));
                      }

                      listBox.setText(joinSet(users));
                      Toast.makeText(isto,
                              users.size() + " perfis encontrados.", Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(isto,
                              "Não consegui ler um dos arquivos.", Toast.LENGTH_LONG).show();
                  }
              }

              private String readUri(Uri uri) throws Exception {
                  tente (InputStream em = getContentResolver().openInputStream(uri);
                       ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                      se (in == nulo) retorne "";
                      byte[] buf = novo byte[8192];
                      int n;
                      enquanto ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                      retornar out.toString(StandardCharsets.UTF_8.name());
                  }
              }

              private LinkedHashSet<String> parseUsers(String raw) {
                  LinkedHashSet<String> out = new LinkedHashSet<>();
                  se (raw == null) retorne out;

                  String aparada = raw.trim();
                  boolean looksJson = trimmed.startsWith("{") || trimmed.startsWith("[");

                  Padrão jsonValue = Padrão.compile(
                          "\\\"valor\\\"\\s*:\\s*\\\"([A-Za-z0-9._]{1,30})\\\"");
                  Correspondente jm = jsonValue.matcher(raw);
                  enquanto (jm.find()) out.add(jm.group(1));

                  Pattern jsonTitle = Pattern.compile(
                          "\\\"título\\\"\\s*:\\s*\\\"([A-Za-z0-9._]{1,30})\\\"");
                  Matcher jt = jsonTitle.matcher(raw);
                  enquanto (jt.find()) out.add(jt.group(1));

                  se (!pareceJson) {
                      Padrão emNome = Padrão.compilar(
                              "(?<![A-Za-z0-9._])@([A-Za-z0-9._]{1,30})");
                      Matcher am = atName.matcher(raw);
                      enquanto (am.find()) out.add(am.group(1));

                      for (String token : raw.split("[,;\\n\\r\\t ]+")) {
                          String u = token.trim();
                          se (u.startsWith("@")) u = u.substring(1);
                          if (u.matches("[A-Za-z0-9._]{1,30}")) out.add(u);
                      }
                  }
                  retornar para fora;
              }

              privado void salvarLista(booleano shuffle) {
                  List<String> q = new ArrayList<>(parseUsers(listBox.getText().toString()));
                  se (embaralhar) Collections.shuffle(q);
                  UserStore.saveQueue(this, q);
                  listBox.setText(joinQueue(q));
                  atualizar();
                  Toast.makeText(isto,
                          "Lista salva com " + q.size() + " perfis.", Toast.LENGTH_LONG).show();
              }

              privado void refresh() {
                  List<String> q = UserStore.queue(this);
                  int idx = UserStore.index(this);
                  se (estatísticas != nulo) {
                      stats.setText("Total: " + q.size() +
                              " |usos: " + idx +
                              " |restante: " + Math.max(0, q.size() - idx));
                  }
              }

              private String joinQueue(List<String> q) {
                  StringBuilder s = novo StringBuilder();
                  for (String u : q) s.append("@").append(u).append("\n");
                  retornar s.toString();
              }

              private String joinSet(LinkedHashSet<String> q) {
                  retornar joinQueue(new ArrayList<>(q));
              }

              private TextView text(String value, int sp, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(valor);
                  t.setTextSize(sp);
                  t.setTextColor(Color.BLACK);
                  t.setPadding(0, dp(6), 0, dp(6));
                  if (negrito) t.setTypeface(null, android.graphics.Typeface.BOLD);
                  retornar t;
              }

              botão privado button(String label) {
                  Botão b = novo Botão(este);
                  b.setText(rótulo);
                  b.setAllCaps(false);
                  b.setTextSize(16);
                  retornar b;
              }

              privado LinearLayout.LayoutParams completo() {
                  LinearLayout.LayoutParams p = novo LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  p.setMargins(0, dp(6), 0, dp(6));
                  retornar p;
              }

              int privado dp(int n) {
                  retorne Math.round(n * getResources().getDisplayMetrics().density);
              }

              public static final class UserStore {
                  private static final String PREF = "teclado_sorteio";
                  private static final String QUEUE = "fila";
                  private static final String INDEX = "índice";

                  private static SharedPreferences p(Context c) {
                      retornar c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
                  }

                  public static void saveQueue(Context c, List<String> q) {
                      JSONArray arr = novo JSONArray();
                      para (String u : q) arr.put(u);
                      p(c).edit()
                              .putString(QUEUE, arr.toString())
                              .putInt(INDEX, 0)
                              .aplicar();
                  }

                  public static List<String> fila(Context c) {
                      ArrayList<String> out = new ArrayList<>();
                      tentar {
                          JSONArray arr = new JSONArray(p(c).getString(QUEUE, "[]"));
                          para (int i = 0; i < arr.length(); i++) {
                              String u = arr.optString(i, "");
                              if (!u.isEmpty()) out.add(u);
                          }
                      } catch (Exceção ignorada) {}
                      retornar para fora;
                  }

                  public static int index(Context c) {
                      int i = p(c).getInt(INDEX, 0);
                      retorne Math.max(0, Math.min(i, queue(c).size()));
                  }

                  public static void setIndex(Context c, int i) {
                      int seguro = Math.max(0, Math.min(i, queue(c).size()));
                      p(c).edit().putInt(INDEX, seguro).apply();
                  }
              }
          }
          Fim do jogo

          cat > app/src/main/java/com/tecladosorteio/app/GiveawayKeyboardService.java <<'EOF'
          pacote com.tecladosorteio.app;

          import android.graphics.Color;
          import android.inputmethodservice.InputMethodService;
          import android.text.InputType;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputConnection;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.List;

          public class GiveawayKeyboardService extends InputMethodService {
              Informações privadas do TextView;
              Visualização de texto privada próxima;
              Inserir botão privado;

              @Substituir
              public View onCreateInputView() {
                  LinearLayout raiz = novo LinearLayout(this);
                  raiz.setOrientation(LinearLayout.VERTICAL);
                  raiz.setPadding(dp(10), dp(8), dp(10), dp(8));
                  root.setBackgroundColor(Color.rgb(28, 28, 32));

                  info = label("", 13, false);
                  root.addView(info, full());

                  próximo = rótulo("", 21, verdadeiro);
                  root.addView(next, full());

                  insert = button("INSERIR PRÓXIMO @");
                  inserir.setOnClickListener(v -> inserirPróximo());
                  root.addView(insert, full());

                  LinearLayout linha = novo LinearLayout(this);
                  linha.setOrientation(LinearLayout.HORIZONTAL);

                  Botão desfazer = botão("†¶ Desfazer");
                  undo.setOnClickListener(v -> undo());
                  linha.adicionarVisualização(desfazer, peso());

                  Button other = button("âŒ¨ Outro teclado");
                  outro.setOnClickListener(v -> {
                      tentar {
                          switchToNextInputMethod(false);
                      } catch (Throwable e) {
                          Toast.makeText(isto,
                                  "Use o seletor de teclado do Android.",
                                  Toast.LENGTH_SHORT).show();
                      }
                  });
                  linha.adicionarVisualização(outro, peso());

                  raiz.adicionarVisualização(linha, completa());
                  atualizar();
                  retornar raiz;
              }

              @Substituir
              public void onStartInputView(EditorInfo infoAttr, boolean restarting) {
                  super.onStartInputView(infoAttr, reiniciando);

                  int variation = infoAttr == null ? 0 :
                          (infoAttr.inputType & InputType.TYPE_MASK_VARIATION);

                  senha booleana =
                          variação == InputType.TYPE_TEXT_VARIATION_PASSWORD ||
                          variação == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD ||
                          variação == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD ||
                          variação == InputType.TYPE_NUMBER_VARIATION_PASSWORD;

                  se (inserir != nulo) {
                      inserir.setEnabled(!senha);
                      se (senha) {
                          info.setText("Campo de senha detectado");
                          next.setText("Troque para seu teclado normal");
                      } outro {
                          atualizar();
                      }
                  }
              }

              privado void inserirPróximo() {
                  List<String> q = MainActivity.UserStore.queue(this);
                  int idx = MainActivity.UserStore.index(this);

                  se (idx >= q.size()) {
                      Toast.makeText(this, "Fila concluída.", Toast.LENGTH_SHORT).show();
                      atualizar();
                      retornar;
                  }

                  InputConnection ic = getCurrentInputConnection();
                  se (ic == nulo) retorne;

                  ic.commitText("@" + q.get(idx), 1);
                  MainActivity.UserStore.setIndex(this, idx + 1);
                  atualizar();
              }

              privado void desfazer() {
                  int idx = MainActivity.UserStore.index(this);
                  se (idx <= 0) {
                      Toast.makeText(this, "Nada para fazer.", Toast.LENGTH_SHORT).show();
                      retornar;
                  }
                  MainActivity.UserStore.setIndex(this, idx - 1);
                  atualizar();
              }

              privado void refresh() {
                  se (info == nulo || próximo == nulo || inserir == nulo) retorne;

                  List<String> q = MainActivity.UserStore.queue(this);
                  int idx = MainActivity.UserStore.index(this);

                  info.setText("Usados: " + idx + "/" + q.size() +
                          "• Restam: " + Math.max(0, q.size() - idx));

                  se (idx < q.size()) {
                      String u = q.get(idx);
                      next.setText("Próximo: @" + u);
                      insert.setText("INSERIR @" + você);
                  } outro {
                      next.setText(q.isEmpty() ? "Nenhuma lista incluída" : "Fila concluída");
                      insert.setText("INSERIR PRÓXIMO @");
                  }
              }

              private TextView label(String value, int sp, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(valor);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(sp);
                  t.setPadding(dp(4), dp(5), dp(4), dp(5));
                  if (negrito) t.setTypeface(null, android.graphics.Typeface.BOLD);
                  retornar t;
              }

              botão privado button(String label) {
                  Botão b = novo Botão(este);
                  b.setText(rótulo);
                  b.setAllCaps(false);
                  b.setTextSize(14);
                  retornar b;
              }

              privado LinearLayout.LayoutParams completo() {
                  LinearLayout.LayoutParams p = novo LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  p.setMargins(dp(2), dp(2), dp(2), dp(2));
                  retornar p;
              }

              private LinearLayout.LayoutParams weight() {
                  LinearLayout.LayoutParams p = novo LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  p.setMargins(dp(2), dp(2), dp(2), dp(2));
                  retornar p;
              }

              int privado dp(int n) {
                  retorne Math.round(n * getResources().getDisplayMetrics().density);
              }
          }
          Fim do jogo

      - nome: Compilador APK
        execute: gradle --no-daemon assembleDebug

      - nome: Renomear APK
        executar: cp app/build/outputs/apk/debug/app-debug.apk Teclado-Sorteio.apk


      - nome: Criar release com APK
        ambiente:
          GH_TOKEN: ${{ github.token }}
        executar: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Teclado-Sorteio.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Teclado Sorteio APK" \
            --notes "APK gerado automaticamente pelo GitHub Actions."

      - nome: Disponibilizar APK
        utiliza: actions/upload-artifact@v4
        com:
          nome: to-Sorteio-APK
          caminho: teclado-Sorteio.apk
          dias de retenção: 30
